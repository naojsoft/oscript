name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NOTE: pinned, so that a new ruff release does not turn the build red
      # on its own; bump it deliberately
      - run: pip install ruff==0.12.0

      - run: ruff check --output-format=github .

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm needs the tags to work out a version
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # g2base (from g2cam) supplies Bunch, which the parsers import.  It is
      # not on PyPI, and --no-deps keeps its server-side requirements
      # (pymongo, redis, ...) out of the test environment: the parsers only
      # use the pure python bits.
      - run: pip install --no-deps git+https://github.com/naojsoft/g2cam

      - run: pip install .[test]

      - run: pytest oscript/tests -v

  build:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - run: twine check dist/*
