[build-system]
requires = ["setuptools>=77",
            "setuptools_scm[toml]>=7",
            "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscript"
description = "Modules for implementing Subaru Telescope Observation Script"
readme = {file = "README.txt", content-type = "text/plain"}
authors = [
    {name = "Software Division, Subaru Telescope, NAOJ", email = "ocs@naoj.org"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
keywords = ["subaru", "telescope", "parsing", "observation", "script", "tools"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "ply>=3.11",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/naojsoft/oscript"

[tool.setuptools]
zip-safe = false
include-package-data = false
script-files = [
    "scripts/check_ope",
    "scripts/sk_lexer",
    "scripts/sk_parser",
    "scripts/sk_decode",
    "scripts/para_lexer",
    "scripts/para_parser",
    "scripts/para_validator",
    "scripts/testfunc_sk_parser",
]

[tool.setuptools.packages.find]
include = ["oscript*"]

[tool.setuptools_scm]
write_to = "oscript/version.py"
version_scheme = "release-branch-semver"

[tool.ruff]
target-version = "py311"
extend-exclude = [
    # generated by setuptools_scm
    "oscript/version.py",
    # generated by ply
    "*_tab.py",
    "**/parsetab.py",
    # NOTE: python 2 code, does not parse under python 3 (see 'def async()')
    "oscript/tasks/skCompTask.py",
]

[tool.ruff.lint]
# the default rule set: pycodestyle errors and pyflakes
select = ["E4", "E7", "E9", "F"]
